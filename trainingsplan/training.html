/* Layout: wie die Spiele-Anzeige – Kopfleiste mit Wappen, vereinsblaue Tafel.
   Aussehen seit 06.11.2026 wie die neue Homepage – siehe Abschnitt „Design wie die neue Homepage“ am Ende.
   Links die Platzgrafik mit der Belegung zur gewählten Zeit, rechts der Tagesablauf; umschaltbar auf Wochenübersicht.
   Bewusst ein festes Erscheinungsbild in Blau/Weiß (Fernseher im Vereinsheim, Homepage, Handy). */
:root {
  --blue: #0B3D91;        /* Vereinsblau */
  --blue-deep: #082D6E;   /* Tafelgrund */
  --blue-row: #0F4AA6;    /* abgesetzte Flächen */
  --line: #2A5AAE;
  --white: #FFFFFF;
  --muted: #BCD0EF;
  --dim: #7E9CCB;
  --live: #5BE39A;
  --grass: #0E9F45;
  --grass-line: rgba(255,255,255,.85);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--blue-deep); color: var(--white);
  font-family: var(--body); font-size: clamp(15px, 1.05vw, 22px);
  font-variant-numeric: tabular-nums;
}
.board { box-sizing: border-box; min-height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
.pad { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1200px) { .pad { padding-left: max(.8vw, env(safe-area-inset-left, 0px)); padding-right: max(.8vw, env(safe-area-inset-right, 0px)); } }

/* Kopfleiste */
.top {
  background: var(--white); color: var(--blue);
  display: flex; align-items: center; gap: clamp(12px, 1.6vw, 32px); flex-wrap: wrap;
  padding-block: clamp(4px, .35vw, 8px);
  border-bottom: clamp(3px, .3vw, 6px) solid var(--blue);
}
.logo { flex: none; width: clamp(36px, 2.9vw, 58px); height: clamp(36px, 2.9vw, 58px); display: grid; place-items: center; }
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.club { min-width: 0; flex: 1 1 11em; }
.club .titelzeile { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .6em; }
.club h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(21px, 1.8vw, 36px); line-height: 1.05; letter-spacing: .01em; white-space: nowrap; }
.club .sub { font-family: var(--display); font-weight: 600; font-size: clamp(15px, 1.25vw, 25px); letter-spacing: .04em; text-transform: uppercase; color: var(--blue-row); line-height: 1.05; }
.club p { margin: .2em 0 0; color: var(--blue-row); font-weight: 600; font-size: .8em; letter-spacing: .1em; text-transform: uppercase; }
.club p.gueltig { margin-top: .1em; text-transform: none; letter-spacing: .01em; font-size: .88em; color: var(--blue); display: flex; flex-wrap: wrap; gap: .2em .5em; align-items: baseline; }
.club p.gueltig .warn { background: #FFE08A; color: #5A4200; padding: 0 .4em; border-radius: 3px; font-size: .9em; }
.clock { display: flex; align-items: baseline; justify-content: flex-end; gap: .6em; flex-wrap: wrap; text-align: right; }
.clock .time { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 2.3vw, 46px); line-height: 1; color: var(--blue); }
.clock .date { order: -1; color: var(--blue-row); font-weight: 600; font-size: 1.05em; }

/* Hauptbereich */
.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: clamp(14px, 1.8vw, 36px); min-height: 0; padding-block: clamp(10px, .9vw, 18px); }
.col { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: .6em; }
.col h2 {
  margin: 0; display: flex; align-items: baseline; gap: .6em; flex-wrap: wrap;
  font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  font-size: clamp(16px, 1.35vw, 30px); padding-bottom: .3em; border-bottom: 3px solid var(--white);
}
.col h2 .when { background: var(--white); color: var(--blue); padding: 0 .35em; }
.col h2 .count { margin-left: auto; color: var(--muted); font-family: var(--body); font-weight: 500; font-size: .55em; letter-spacing: .08em; }

/* Tag- und Zeitwahl über der Platzgrafik */
.pick { display: flex; flex-wrap: wrap; gap: .4em; align-items: center; }
.pick button, .ctl button, .ctl select {
  font: inherit; font-size: .9em; color: var(--white); background: transparent; border: 1px solid var(--line);
  padding: .28em .75em; border-radius: 4px; cursor: pointer;
}
.pick button[aria-pressed="true"], .ctl button[aria-pressed="true"] { color: var(--blue); background: var(--white); border-color: var(--white); }
.pick button.now { border-color: var(--live); color: var(--live); }
.pick button.now[aria-pressed="true"] { background: var(--live); color: var(--blue-deep); border-color: var(--live); }
.pick button:focus-visible, .ctl button:focus-visible, .ctl select:focus-visible, .slider input:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
.slider { display: flex; align-items: center; gap: .8em; }
.slider input { flex: 1; min-width: 0; accent-color: var(--white); }
.slider output { font-family: var(--display); font-weight: 700; font-size: 1.6em; min-width: 3.2ch; }
.slider .lab { color: var(--muted); font-size: .85em; }

.pitchwrap { flex: 1; min-height: 0; display: grid; place-items: center; }
#pitch { width: 100%; height: auto; max-height: 72vh; display: block; }
#pitch text { font-family: var(--display); }

/* Tagesablauf rechts */
.list { display: flex; flex-direction: column; }
.unit {
  display: grid; grid-template-columns: .45em 3.9em minmax(0, 1fr) auto; column-gap: .8em; align-items: center;
  padding: .36em .6em .36em 0; border-bottom: 1px solid var(--line); transition: opacity .3s ease;
}
.unit .sw { align-self: stretch; border-radius: 2px; }
.unit .t { font-family: var(--display); font-weight: 700; font-size: 1.55em; line-height: 1; }
.unit .who { min-width: 0; }
.unit .team { font-family: var(--display); font-weight: 600; font-size: 1.35em; line-height: 1.1; overflow-wrap: anywhere; }
.unit .meta { color: var(--muted); font-size: .85em; }
.unit .fld { display: inline-block; font-size: .85em; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 0 .4em; border-radius: 3px; border: 1px solid var(--dim); color: var(--white); margin-right: .3em; }
.unit.at { background: var(--white); color: var(--blue); border-bottom-color: var(--blue-deep); }
.unit.at .meta { color: var(--blue-row); }
.unit.at .fld { border-color: var(--blue); color: var(--blue); }
.unit.done { opacity: .45; }
.unit.other { opacity: .28; }
.state { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 1.05em; white-space: nowrap; text-align: right; color: var(--muted); }
.state.live { color: var(--live); }
.unit.at .state.live { color: #0E8A4C; }
.state.live::before { content: ""; display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: currentColor; margin-right: .4em; vertical-align: .08em; animation: pulse 1.6s ease-in-out infinite; }
.state.soon { color: var(--white); background: var(--blue-row); padding: .1em .5em; border-radius: 3px; }
.unit.at .state.soon { background: var(--blue); }
@keyframes pulse { 50% { opacity: .25; } }

.empty { padding: 1.2em .6em; border-bottom: 1px solid var(--line); }
.empty strong { display: block; font-family: var(--display); font-size: 1.8em; font-weight: 600; text-transform: uppercase; }
.empty span { color: var(--muted); }

.mine { padding: .6em .7em; background: var(--blue-row); border-radius: 4px; }
.mine b { font-family: var(--display); font-size: 1.3em; letter-spacing: .02em; }
.mine ul { margin: .3em 0 0; padding: 0; list-style: none; display: grid; gap: .15em; }
.mine li { display: flex; gap: .6em; flex-wrap: wrap; }
.mine li span:first-child { min-width: 2.2em; font-weight: 600; }

/* Reiter */
.tabs { display: flex; align-items: center; gap: .6em 1em; flex-wrap: wrap; padding-block: .55em; background: var(--blue); }
.tablist { display: flex; gap: .3em; flex-wrap: wrap; }
.tablist button { font: inherit; font-family: var(--display); font-weight: 600; font-size: 1.05em; letter-spacing: .05em; text-transform: uppercase;
  color: var(--white); background: transparent; border: 1px solid var(--line); padding: .25em .9em; border-radius: 4px; cursor: pointer; }
.tablist button[aria-selected="true"] { background: var(--white); color: var(--blue); border-color: var(--white); }
.tablist button:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
.tabs .spacer { flex: 1; }

/* Wochenplan: je Tag ein Raster mit den Platzbereichen als Bahnen und 15-Minuten-Zeilen */
.view { padding-block: clamp(10px, .9vw, 18px); min-width: 0; }
.wk { --slot: clamp(9px, calc((100vh - 26em) / 48), 1.1em); --gx: clamp(8px, .8vw, 16px); display: grid; grid-template-columns: 2.6em repeat(3, minmax(0, 1fr)) 2.6em; gap: clamp(14px, 1.4vw, 26px) var(--gx); }
.wk .rest { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); column-gap: var(--gx); min-width: 0; }
.day { min-width: 0; }
.day h3 { margin: 0; line-height: 1.1; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 1.25em; padding-bottom: .15em; border-bottom: 3px solid var(--white); }
.day.today h3 span { background: var(--white); color: var(--blue); padding: 0 .3em; }
.lh, .dg { display: grid; grid-template-columns: 0 repeat(5, minmax(0, 1fr)) minmax(0, .85fr); }
.day.ohne-lb .lh, .day.ohne-lb .dg { grid-template-columns: 0 repeat(5, minmax(0, 1fr)); }
.lh { color: var(--muted); padding: .2em 0; }
.lh span { font-size: .72em; font-weight: 600; letter-spacing: .04em; text-align: center; white-space: nowrap; overflow: hidden; }
.dg { grid-template-rows: repeat(var(--n), var(--slot)); position: relative; }
.dg .lane { grid-row: 1 / -1; border-left: 1px solid var(--line); background: repeating-linear-gradient(to bottom, rgba(255,255,255,.13) 0 1px, transparent 1px calc(var(--slot) * 4)); }
.dg .lane.lb { background-color: rgba(201,33,30,.12); }
.dg .ax { grid-column: 1; font-size: .72em; color: var(--muted); line-height: 1; transform: translateY(-.45em); text-align: right; padding-right: .45em; display: none; }
/* Zeitleisten außerhalb der Tageskacheln: links und rechts jeder Zeile, damit alle Tage gleich breit sind */
.axcol { min-width: 0; }
.axcol .ph { visibility: hidden; }
.axcol h3 { margin: 0; line-height: 1.1; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 1.25em; padding-bottom: .15em; border-bottom: 3px solid transparent; }
.axg { display: grid; grid-template-rows: repeat(var(--n), var(--slot)); }
.axg span { font-size: .72em; color: var(--muted); line-height: 1; transform: translateY(-.45em); white-space: nowrap; }
.axcol.l .axg span { text-align: right; }
.axcol.r .axg span { text-align: left; }
.blk { margin: 1px; border-radius: 3px; padding: 0 .2em; overflow: hidden; cursor: pointer; z-index: 1;
  font-family: var(--display); font-weight: 700; line-height: 1.05; border: 0; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; }
/* Einheitliche Schriftgröße in allen Feldern: richtet sich nach der engsten Stelle (schmale Spalte, kurze Laufbahn-Zeit) */
.blk { font-size: calc(var(--slot) * var(--bk, 1.5)); }   /* --bk: per Skript so groß wie möglich gewählt, ohne dass irgendwo etwas abgeschnitten wird */
.blk .nm { letter-spacing: -.02em; hyphens: manual; -webkit-hyphens: manual; }
.blk.lbk { padding: 0 1px; line-height: 1; }
.blk.lbk small { font-size: .66em; margin-top: 0; }   /* Laufbahn-Spalte ist schmal: nur die Uhrzeit etwas kleiner */
.blk { word-break: normal; overflow-wrap: normal; hyphens: none; }
.blk .nm { display: block; max-width: 100%; }
.blk small { display: block; font-family: var(--display); font-weight: 600; font-size: .8em; line-height: 1; margin-top: .1em; letter-spacing: -.02em; }
.blk:focus-visible { outline: 2px solid var(--white); outline-offset: 1px; }
.blk { --edge: rgba(255,255,255,.75); --ew: 1.5px; --glow: 0 0 0 0 transparent; position: relative;
  box-shadow: inset 0 0 0 var(--ew) var(--edge), var(--glow); }
/* Platzwechsel: oberer Abschnitt ohne Unterkante und leicht überlappend, damit die Fläche ohne Trennlinie durchläuft */
.blk.jb { box-shadow: inset var(--ew) 0 0 var(--edge), inset calc(-1 * var(--ew)) 0 0 var(--edge), inset 0 var(--ew) 0 var(--edge), var(--glow);
  margin-bottom: calc(-1 * var(--ew)) !important; z-index: 2; }
.blk.jt { margin-top: 0 !important; }
.blk.ueber { overflow-x: clip; overflow-y: visible; justify-content: flex-start; padding-top: .35em; z-index: 3; }
.blk.other { opacity: .18; }
.blk.mine { --g: var(--live); --glow: 0 0 0 3px var(--g); }
/* zusammenhängende Flächen (Platzwechsel): an der Nahtstelle keine Umrandung, damit es ein Feld bleibt */
.blk.mine.gb0 { --glow: -3px 0 0 0 var(--g), 3px 0 0 0 var(--g), 0 -3px 0 0 var(--g), -3px -3px 0 0 var(--g), 3px -3px 0 0 var(--g); }
.blk.mine.gt0 { --glow: -3px 0 0 0 var(--g), 3px 0 0 0 var(--g), 0 3px 0 0 var(--g), -3px 3px 0 0 var(--g), 3px 3px 0 0 var(--g); }
.blk.mine.gb0.gt0 { --glow: -3px 0 0 0 var(--g), 3px 0 0 0 var(--g); }
.nowline { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--live); z-index: 5; pointer-events: none; box-shadow: 0 0 0 1px rgba(255,255,255,.85); }
.nowline::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.legende h3 { margin: 0 0 .5em; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 1.25em; padding-bottom: .15em; border-bottom: 3px solid var(--white); }
.legende ul { list-style: none; margin: 0; padding: 0; columns: 2 12em; column-gap: 1em; }
.legende li { break-inside: avoid; margin-bottom: .3em; }
.legende li { display: flex; align-items: center; gap: .5em; min-width: 0; font-size: .9em; }
.legende button { font: inherit; font-family: var(--display); font-weight: 700; min-width: 4.6em; padding: .1em .4em; border: 0; border-radius: 3px; cursor: pointer; text-align: center; }
.legende li.other { opacity: .3; }
.wkhint { color: var(--muted); font-size: .8em; margin: .5em 0 0; }
.platzfig { min-width: 0; display: flex; flex-direction: column; }
.platzfig h3 { margin: 0; line-height: 1.1; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 1.25em; padding-bottom: .15em; border-bottom: 3px solid var(--white); }
.platzfig svg { display: block; width: 80%; height: calc(var(--slot) * 24 + 1.6em); margin: .3em auto 0; }   /* 80 % der Spaltenbreite, mittig */
.platzfig text { font-family: var(--display); }

/* Halle: je Halle eine Liste der Termine nach Wochentag */
.hallen { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26em), 1fr)); gap: clamp(14px, 2vw, 36px); align-items: start; }
.hal h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.35em; letter-spacing: .03em; padding-bottom: .15em; border-bottom: 3px solid var(--white); line-height: 1.15; }
.hal h3 small { display: block; font-family: var(--body); font-weight: 500; font-size: .62em; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hu { display: grid; grid-template-columns: 2.6em 7.6em minmax(0, 1fr) auto; column-gap: .8em; align-items: center; padding: .5em 0; border-bottom: 1px solid var(--line); }
.hu .tg { font-family: var(--display); font-weight: 700; font-size: 1.2em; text-transform: uppercase; }
.hu .tm { font-family: var(--display); font-weight: 700; font-size: 1.2em; white-space: nowrap; }
.hu .team { display: flex; align-items: center; gap: .55em; min-width: 0; font-weight: 600; }
.hu .team .sw { flex: none; width: .55em; align-self: stretch; min-height: 1.4em; border-radius: 2px; }
.hu.heute .tg span { background: var(--white); color: var(--blue); padding: 0 .25em; }
.hu.other { opacity: .28; }
.hu .state { font-size: .95em; }
.leer { color: var(--muted); padding: 1em 0; }
.tt .ut.hall .fl::before { content: "Halle · "; font-weight: 600; }

/* Mannschaften: Tabelle Mannschaft × Wochentag */
.ttwrap { overflow-x: auto; }
.tt { width: 100%; border-collapse: collapse; }
.tt th { text-align: left; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 1.1em; padding: .25em .5em; border-bottom: 3px solid var(--white); white-space: nowrap; }
.tt th.today span { background: var(--white); color: var(--blue); padding: 0 .3em; }
.tt td { border-bottom: 1px solid var(--line); padding: .4em .5em; vertical-align: top; }
.tt td.n { min-width: 11em; }
.tt td.n b { font-family: var(--display); font-size: 1.25em; font-weight: 600; white-space: nowrap; }
.tt td.n .sw { display: inline-block; width: .55em; height: 1.3em; border-radius: 2px; vertical-align: -.25em; margin-right: .5em; }
.tt td.n small { display: block; color: var(--muted); margin-left: 1.05em; }
.tt .ut + .ut { margin-top: .35em; }
.tt .ut .tm { font-family: var(--display); font-weight: 700; font-size: 1.12em; }
.tt .ut .fl { display: block; color: var(--muted); font-size: .85em; }
.tt tr.sel td { background: var(--blue-row); }
.tt tr:hover td { background: rgba(255,255,255,.05); }

@media (max-width: 800px) {
  .wk { grid-template-columns: minmax(0, 1fr); --slot: 1.25em; }
  .axcol { display: none; }
  .wk .rest { display: block; grid-column: auto !important; }
  .lh, .dg { grid-template-columns: 2.7em repeat(5, minmax(0, 1fr)) minmax(0, .85fr); }
  .day.ohne-lb .lh, .day.ohne-lb .dg { grid-template-columns: 2.7em repeat(5, minmax(0, 1fr)); }
  .dg .ax { display: block; }
  .nowline { left: 2.7em; }
            .day { margin-bottom: .8em; }
  .tt thead { display: none; }
  .tt, .tt tbody, .tt tr, .tt td { display: block; }
  .tt tr { padding: .5em 0; border-bottom: 1px solid var(--line); }
  .tt td { border: 0; padding: .12em 0; }
  .tt td[data-tag]:empty { display: none; }
  .tt td[data-tag] { display: grid; grid-template-columns: 2.4em minmax(0, 1fr); }
  .tt td[data-tag]::before { content: attr(data-tag); color: var(--muted); font-weight: 600; }
  .tt td[data-tag] .ut { grid-column: 2; }
  .tt .ut .fl { display: inline; margin-left: .4em; }
}

/* Helle Darstellung (Homepage): Wochenplan und Tabelle auf weißem Grund */
.hell .view { background: #F4F7FC; color: #0B2A5C; }
.hell .day h3, .hell .platzfig h3, .hell .tt th { border-bottom-color: var(--blue); color: var(--blue); }
.hell .day.today h3 span, .hell .tt th.today span { background: var(--blue); color: #fff; }

<script>
// Daten: trainingsplan.json (vom GitHub-Workflow aus der Excel-Datei erzeugt). Eingebettet als Startwert,
// auf dem Webspace lädt die Seite die Datei alle 10 Minuten nach.
let DATEN = JSON.parse(document.getElementById("daten").textContent);

const TAGE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const KURZ = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONATE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const FELDNAME = { Kleinfeld: "Kleinfeld", VL: "VL", VR: "VR", HL: "HL", HR: "HR", Laufbahn: "Laufbahn" };

const S = { ansicht: "woche", team: "", plan: "", tag: null, zeit: null };   // tag/zeit null = live

function min(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function hm(m) { return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function de(isoStr) { const [y, m, d] = isoStr.split("-"); return d + "." + m + "." + y; }
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function wtag(d) { return d.getDay() === 0 ? 7 : d.getDay(); }   // 1 = Montag … 7 = Sonntag

function aktuellerPlan(d) {
  const t = iso(d);
  const p = DATEN.plaene.find(p => p.gueltig.some(([a, b]) => a <= t && t <= b));
  if (p) return p;
  const kommend = DATEN.plaene.map(p => ({ p, a: p.gueltig.map(g => g[0]).filter(a => a > t).sort()[0] })).filter(x => x.a).sort((x, y) => x.a < y.a ? -1 : 1);
  return kommend.length ? kommend[0].p : DATEN.plaene[DATEN.plaene.length - 1];
}
function plan() { return DATEN.plaene.find(p => p.blatt === S.plan) || aktuellerPlan(new Date()); }
function kontrast(hex) {   // schwarz oder weiß – je nachdem, was auf der Hintergrundfarbe besser lesbar ist (WCAG)
  const c = hex.replace("#", ""), ch = [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4));
  const L = .2126 * ch[0] + .7152 * ch[1] + .0722 * ch[2];
  return (1.05 / (L + .05)) >= ((L + .05) / .05) ? "#FFFFFF" : "#000000";
}
function felderText(f) { return f.map(x => FELDNAME[x] || x).join(" + "); }
function istMeins(e) { return !S.team || e.mitglieder.includes(S.team) || e.team === S.team; }

/* ---------- Platzgrafik ---------- */
// Grundriss nach dem Luftbild der Anlage (gedreht: Großfeld senkrecht, H oben, V unten).
// Laufbahn rechts an der langen Seite, Kleinfeld hinter der vorderen Torlinie (leicht zur Laufbahn hin versetzt),
// Wege (rot-braun) um Großfeld und Kleinfeld, übrige Fläche Rasen. viewBox 0 0 312 500
const P = { x: 24, y: 10, w: 236, h: 366 };                 // Großfeld 68 × 105 m
const PX = P.x + P.w / 2, PY = P.y + P.h / 2;
const K = { x: 88, y: 402, w: 130, h: 90 };                 // Kleinfeld
const T = { x: 264, y: 6, w: 26, h: 386 };                  // Laufbahn (4 Bahnen)
const ZONEN = {
  HL: { x: P.x, y: P.y, w: P.w / 2, h: P.h / 2 }, HR: { x: PX, y: P.y, w: P.w / 2, h: P.h / 2 },
  VL: { x: P.x, y: PY, w: P.w / 2, h: P.h / 2 }, VR: { x: PX, y: PY, w: P.w / 2, h: P.h / 2 },
  Kleinfeld: K, Laufbahn: T
};
const VIEWBOX = "0 0 312 500";
function grundriss(ohneKreise) {   // ohneKreise: Kreise zeichnet der Aufrufer selbst (gestreckte Grafik)
  const L = 'stroke="var(--grass-line)" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke"';
  const sx = P.w / 68, sy = P.h / 105;
  const pw = 40.32 * sx, pd = 16.5 * sy, gw = 18.32 * sx, gd = 5.5 * sy, ps = 11 * sy, R = 9.15 * sy;
  const ang = Math.asin((pd - ps) / R), dx = R * Math.cos(ang);
  const r = (x, y, w, h, f, extra) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + f + '"' + (extra || "") + '/>';
  let s = "";
  s += r(0, 0, 312, 500, "#9CC77E", ' rx="6"');                                   // Rasen rundherum
  s += r(8, 2, 286, 394, "#D29A84");                                               // Weg um das Großfeld
  s += r(K.x - 8, 396, K.w + 16, 104, "#D29A84");                                  // Weg um das Kleinfeld
  s += r(P.x, P.y, P.w, P.h, "var(--grass)");
  s += r(T.x, T.y, T.w, T.h, "#C0392B");

function umbruch(text, maxZ) {

  let s = grundriss();
  const frei = new Set(["HL", "HR", "VL", "VR", "Kleinfeld", "Laufbahn"]);
  for (const e of aktiv) {
    const gruppen = [e.felder.filter(f => ["HL","HR","VL","VR"].includes(f)), e.felder.filter(f => f === "Kleinfeld"), e.felder.filter(f => f === "Laufbahn")].filter(g => g.length);
    for (const g of gruppen) {

      s += '<rect x="' + (r.x + 3) + '" y="' + (r.y + 3) + '" width="' + (r.w - 6) + '" height="' + (r.h - 6) + '" rx="3" fill="' + e.farbe + '" fill-opacity=".9" stroke="' + (S.team && m ? "#fff" : "none") + '" stroke-width="3"/>';

        let fs = r.h < 120 ? 19 : 25;

        const laengstes = Math.max(...lbl.split(" ").map(x => x.length));

        const zeilen = umbruch(lbl, Math.floor((r.w - 18) / (fs * .56)));

/* ---------- Anzeige-Logik ---------- */
function anzeigeZeitpunkt(p, now) {
  // live: heute jetzt; wenn gerade nichts läuft, nächste Einheit heute, sonst nächster Trainingstag
  const t = now.getHours() * 60 + now.getMinutes();
  const heute = wtag(now);
  const e = p.einheiten;
  if (e.some(x => x.tag === heute && min(x.von) <= t && t < min(x.bis))) return { tag: heute, zeit: t, label: "Jetzt", live: true };
  const spaeter = e.filter(x => x.tag === heute && min(x.von) > t).map(x => min(x.von));
  if (spaeter.length) return { tag: heute, zeit: Math.min(...spaeter), label: "Heute ab " + hm(Math.min(...spaeter)), live: false };
  for (let k = 1; k <= 7; k++) {
    const tg = ((heute - 1 + k) % 7) + 1;
    const st = e.filter(x => x.tag === tg).map(x => min(x.von));
    if (st.length) return { tag: tg, zeit: Math.min(...st), label: (k === 1 ? "Morgen" : TAGE[tg % 7]) + " ab " + hm(Math.min(...st)), live: false };
  }
  return { tag: heute, zeit: t, label: "Jetzt", live: true };
}

/* ---------- Wochenplan ---------- */
const LANES = ["Kleinfeld", "VL", "VR", "HL", "HR", "Laufbahn"];
const LANEKURZ = ["Kleinfeld", "VL", "VR", "HL", "HR", "LB"];

  const idx = felder.map(f => LANES.indexOf(f)).filter(i => i >= 0).sort((a, b) => a - b), out = [];

// gesamter Zeitraum einer Mannschaft am Tag: direkt aneinander anschließende Einheiten (auch auf anderen Platzteilen)
function gesamtZeit(tagE, u, von, bis) {
  const gleich = e => e.team === u.team;
  let weiter = true;
  while (weiter) {
    weiter = false;
    for (const e of tagE) if (gleich(e)) {
      if (min(e.bis) === von || (min(e.von) < von && min(e.bis) > von)) { von = min(e.von); weiter = true; }
      if (min(e.von) === bis || (min(e.bis) > bis && min(e.von) < bis)) { bis = min(e.bis); weiter = true; }
    }
  }

}
function renderWoche(p, now) {
  const tage = wochentage(p);
  const vs = p.einheiten.map(e => min(e.von)), bs = p.einheiten.map(e => min(e.bis));
  const start = vs.length ? Math.floor(Math.min(...vs) / 60) * 60 : 960, ende = bs.length ? Math.ceil(Math.max(...bs) / 60) * 60 : 1320;
  const n = (ende - start) / 15, heute = wtag(now), tNow = now.getHours() * 60 + now.getMinutes();
  const wk = document.getElementById("wk");
  wk.style.setProperty("--days", tage.length);
  const kacheln = tage.map(tag => {
    let g = '';
    for (let m = start; m < ende; m += 60) g += '<span class="ax" style="grid-row:' + ((m - start) / 15 + 1) + '">' + hm(m) + '</span>';
    const mitLB = p.einheiten.some(e => e.tag === tag && e.felder.includes("Laufbahn"));   // Laufbahn nur zeigen, wenn dort jemand trainiert
    LANES.forEach((l, i) => { if (l !== "Laufbahn" || mitLB) g += '<span class="lane' + (l === "Laufbahn" ? " lb" : "") + '" style="grid-column:' + (i + 2) + '"></span>'; });
    // Flächen sammeln; gleiche Mannschaft, zeitlich direkt anschließend und überlappende Bahnen = eine zusammenhängende Fläche
    const segs = [], tagE = p.einheiten.filter(x => x.tag === tag);
    for (const u of tagE)
      for (const [a, b] of laeufe(u.felder)) segs.push({ e: u, a, b, r1: (min(u.von) - start) / 15 + 1, r2: (min(u.bis) - start) / 15 + 1 });
    const grp = segs.map((_, i) => i);
    const root = i => grp[i] === i ? i : (grp[i] = root(grp[i]));
    const beruehrt = (x, y) => x.e.team === y.e.team && x.a <= y.b && y.a <= x.b && (x.r2 === y.r1 || y.r2 === x.r1 || (x.r1 === y.r1 && x.r2 === y.r2));
    segs.forEach((x, i) => segs.forEach((y, j) => { if (i < j && beruehrt(x, y)) grp[root(i)] = root(j); }));
    const gruppen = {};
    segs.forEach((x, i) => (gruppen[root(i)] = gruppen[root(i)] || []).push(x));
    for (const gs of Object.values(gruppen)) {
      const von0 = Math.min(...gs.map(x => min(x.e.von))), bis0 = Math.max(...gs.map(x => min(x.e.bis)));
      // Platzwechsel: immer den gesamten Trainingszeitraum der Mannschaft an diesem Tag angeben (z. B. 19:30–21:30)
      const kette = gesamtZeit(tagE, gs[0].e, von0, bis0), von = kette[0], bis = kette[1];
      // Beschriftung im obersten Abschnitt; reicht der Platz nicht, läuft sie in den Abschnitt darunter weiter (gleiche Farbe)
      const traeger = gs.reduce((m, x) => x.r1 < m.r1 || (x.r1 === m.r1 && (x.b - x.a) > (m.b - m.a)) ? x : m, gs[0]);
      const felderAlle = [...new Set(gs.flatMap(x => x.e.felder))];
      for (const x of gs) {
        const u = x.e, hoch = x.r2 - x.r1, breit = x.b - x.a + 1;
        const oben = gs.some(y => y !== x && y.r2 === x.r1 && y.a <= x.b && x.a <= y.b);
        const unten = gs.some(y => y !== x && y.r1 === x.r2 && y.a <= x.b && x.a <= y.b);
        // Kante vollständig von der Nachbarfläche bedeckt? Dann dort keine Umrandung bei der Auswahl
        const bedeckt = nb => { for (let l = x.a; l <= x.b; l++) if (!nb.some(y => y.a <= l && l <= y.b)) return false; return nb.length > 0; };
        const untenVoll = bedeckt(gs.filter(y => y !== x && y.r1 === x.r2)), obenVoll = bedeckt(gs.filter(y => y !== x && y.r2 === x.r1));
        const meins = S.team && istMeins(u), anders = S.team && !istMeins(u);
        const r = (oben ? "0 0 " : "3px 3px ") + (unten ? "0 0" : "3px 3px");
        const lb = x.a === LANES.indexOf("Laufbahn");   // schmale Laufbahn: Zeiten untereinander
        const zeit = lb ? '<small class="zt">' + hm(von) + '–<wbr>' + hm(bis) + '</small>' : ((bis0 - von0) / 15 >= 4 && hoch >= 2 ? '<small>' + hm(von) + '–<wbr>' + hm(bis) + '</small>' : '');
        const txt = x === traeger ? '<span class="nm">' + esc(u.kurz || u.team).replace(/\//g, "/<wbr>").replace(/fußball/gi, m => m.slice(0, 3) + "&shy;" + m.slice(3)) + '</span>' + zeit : '';
        const info = u.team + " · " + TAGE[tag % 7] + " " + hm(von) + "–" + hm(bis) + (gs.length > 1 ? " (" + gs.map(y => y.e.von + "–" + y.e.bis + " " + felderText(y.e.felder)).filter((v, i, a) => a.indexOf(v) === i).join(", ") + ")" : " · " + felderText(u.felder));
        g += '<button type="button" class="blk' + (breit < 2 ? " s" : "") + (lb ? " lbk" : "") + (x === traeger && unten ? " ueber" : "") + (anders ? " other" : "") + (meins ? " mine" : "") + (unten ? " jb" : "") + (oben ? " jt" : "") + (untenVoll ? " gb0" : "") + (obenVoll ? " gt0" : "") + '" data-team="' + esc(u.mitglieder[0]) + '"' +
          ' style="grid-row:' + x.r1 + '/' + x.r2 + ';grid-column:' + (x.a + 2) + '/' + (x.b + 3) + ';background:' + u.farbe + ';color:' + kontrast(u.farbe) +
          ';margin-top:' + (oben ? 0 : 1) + 'px;margin-bottom:' + (unten ? 0 : 1) + 'px;border-radius:' + r + '"' +
          ' title="' + esc(info) + '" aria-label="' + esc(info) + '"' + (x === traeger ? '' : ' tabindex="-1"') + '>' + txt + '</button>';
      }
    }
    if (tag === heute && tNow >= start && tNow < ende && !S.plan) g += '<span class="nowline" style="top:calc(var(--slot) * ' + ((tNow - start) / 15) + ')"></span>';
    return '<section class="day' + (tag === heute ? " today" : "") + (mitLB ? "" : " ohne-lb") + '"><h3><span>' + TAGE[tag % 7] + '</span></h3>' +
      '<div class="lh"><span></span>' + LANEKURZ.filter(x => x !== "LB" || mitLB).map(x => '<span>' + x + '</span>').join("") + '<span></span></div>' +
      '<div class="dg" style="--n:' + n + '">' + g + '</div></section>';
  });
  const platz = '<section class="platzfig"><h3>Aufteilung Sportplatz</h3>' + platzAufteilung() + '</section>';
  kacheln.push(platz);
  // je Zeile drei Kacheln, links und rechts davon die Zeitleiste (rechts nur, wenn daneben ein Tag steht)
  let zeit = '';
  for (let m = start; m < ende; m += 60) zeit += '<span style="grid-row:' + ((m - start) / 15 + 1) + '">' + hm(m) + '</span>';
  const achse = (seite, mitZeit) => '<div class="axcol ' + seite + '" aria-hidden="true"><h3 class="ph">&nbsp;</h3><div class="lh ph"><span>&nbsp;</span></div>' +
    '<div class="axg" style="--n:' + n + '">' + (mitZeit ? zeit : '') + '</div></div>';
  let html = '';
  for (let i = 0; i < kacheln.length; i += 3) {
    const reihe = kacheln.slice(i, i + 3), rechtsTag = i + 2 < tage.length, d = Math.max(0, Math.min(3, tage.length - i));
    if (!rechtsTag && d > 0 && reihe[d] === platz) {

      html += achse("l", true) + reihe.slice(0, d).join("") +
        '<div class="rest" style="grid-column: span ' + (4 - d) + '">' + achse("r", true) + platz + '</div>';
    } else {
      while (reihe.length < 3) reihe.push('<div></div>');
      html += achse("l", true) + reihe.join("") + achse("r", rechtsTag);
    }
  }
  wk.innerHTML = html;
  passePlatzfigAn();
}

function platzAufteilung(seitenverh) {
  // seitenverh = Breite/Höhe der verfügbaren Fläche; die Grafik wird waagerecht gestreckt, Schrift bleibt unverzerrt
  const H = 500, W = Math.max(312, H * (seitenverh || 312 / 500)), f = W / 312;
  let g = grundriss(true);
  for (const q of ["HL", "VR"]) { const z = ZONEN[q]; g += '<rect x="' + z.x + '" y="' + z.y + '" width="' + z.w + '" height="' + z.h + '" fill="#000" fill-opacity=".10"/>'; }
  g += '<line x1="' + PX + '" y1="' + P.y + '" x2="' + PX + '" y2="' + (P.y + P.h) + '" stroke="#fff" stroke-width="2.5" stroke-dasharray="9 6" vector-effect="non-scaling-stroke"/>';
  g += '<line x1="' + P.x + '" y1="' + PY + '" x2="' + (P.x + P.w) + '" y2="' + PY + '" stroke="#fff" stroke-width="2.5" stroke-dasharray="9 6" vector-effect="non-scaling-stroke"/>';
  const lab = (x, y, txt, fs) => '<text x="' + (x * f) + '" y="' + y + '" text-anchor="middle" dominant-baseline="central" font-weight="700" font-size="' + fs + '" fill="#fff">' + txt + '</text>';
  let s = '<g transform="scale(' + f + ' 1)">' + g + '</g>';
  // Mittelkreise rund lassen (außerhalb der Streckung)
  const m = (1 + f) / 2;   // Größe zwischen ungestreckt und gestreckt, damit der Kreis zur Feldbreite passt
  const R = 9.15 * P.h / 105 * m, KL = 'stroke="var(--grass-line)" stroke-width="1.5" fill="none"';
  s += '<circle cx="' + PX * f + '" cy="' + PY + '" r="' + R + '" ' + KL + '/><circle cx="' + PX * f + '" cy="' + PY + '" r="1.8" fill="var(--grass-line)"/>';
  s += '<circle cx="' + (K.x + K.w / 2) * f + '" cy="' + (K.y + K.h / 2) + '" r="' + Math.min(11 * m, K.h / 2 - 6) + '" ' + KL + '/>';
  for (const q of ["HL", "HR", "VL", "VR"]) { const z = ZONEN[q]; s += lab(z.x + z.w / 2, z.y + z.h / 2, q, 44); }
  s += lab(K.x + K.w / 2, K.y + K.h / 2, "Kleinfeld", Math.min(40, 24 * f));
  s += '<text transform="translate(' + ((T.x + T.w / 2) * f) + ' ' + (T.y + T.h / 2) + ') rotate(-90)" text-anchor="middle" dominant-baseline="central" font-weight="700" font-size="' + Math.min(34, 19 * f) + '" fill="#fff">Laufbahn</text>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Aufteilung des Sportplatzes: Großfeld mit HL und HR hinten, VL und VR vorne, rechts die Laufbahn, hinter dem vorderen Tor das Kleinfeld">' + s + '</svg>';
}

// Aufteilung Sportplatz auf die volle Breite der Spalte ziehen (nach dem Einfügen messen)
function passePlatzfigAn() {
  const svg = document.querySelector("#wk .platzfig svg");
  if (!svg || document.getElementById("viewWoche").hidden) return;
  const r = svg.getBoundingClientRect();
  if (r.width > 0 && r.height > 0) svg.outerHTML = platzAufteilung(r.width / r.height);
}
// Schrift in allen Feldern gemeinsam so groß wie möglich wählen, ohne dass ein Name oder eine Uhrzeit abgeschnitten wird
// (wächst mit der Bildschirmgröße, bleibt in allen Feldern gleich)
function passeSchriftAn() {
  const wk = document.getElementById("wk");
  if (!wk || document.getElementById("viewWoche").hidden) return;
  const zuEng = () => [...wk.querySelectorAll(".blk")].some(e => {
    if (!e.offsetParent) return false;
    const nm = e.querySelector(".nm"), sm = e.querySelector("small");
    return (nm && nm.scrollWidth > nm.clientWidth) || (sm && sm.scrollWidth > sm.clientWidth) ||
      (!e.classList.contains("ueber") && e.scrollHeight > e.clientHeight + 1);
  });
  const setze = k => wk.style.setProperty("--bk", k);
  let lo = .6, hi = 2.6;
  setze(hi);
  if (!zuEng()) return;
  for (let i = 0; i < 8; i++) { const m = (lo + hi) / 2; setze(m); if (zuEng()) hi = m; else lo = m; }
  setze(lo);
}
window.addEventListener("resize", () => { clearTimeout(window._pf); window._pf = setTimeout(() => { passePlatzfigAn(); passeSchriftAn(); }, 150); });

/* ---------- Mannschaften ---------- */
function mannschaftsliste() {
  if (DATEN.mannschaften && DATEN.mannschaften.length) return DATEN.mannschaften.map(m => m.name);
  return [...new Set(DATEN.plaene.flatMap(p => p.einheiten.flatMap(e => e.mitglieder)))];
}
function farbeVon(name) { const m = (DATEN.mannschaften || []).find(x => x.name === name); return m ? m.farbe : "#BFBFBF"; }
function renderTeams(p, now) {
  const tage = wochentage(p), heute = wtag(now);
  const liste = mannschaftsliste();
  const namen = liste.filter(n => /^Mädchen/i.test(n)).concat(liste.filter(n => !/^Mädchen/i.test(n)))   // Mädchen ganz oben
    .filter(n => !S.team || n === S.team);
  let h = '<thead><tr><th>Mannschaft</th>' + tage.map(t => '<th' + (t === heute ? ' class="today"' : '') + '><span>' + TAGE[t % 7] + '</span></th>').join("") + '</tr></thead><tbody>';
  for (const n of namen) {
    const es = p.einheiten.filter(e => e.mitglieder.includes(n));
    const hs = (p.halle || []).filter(e => e.mitglieder.includes(n));
    const anzahl = es.filter(e => !es.some(f => f.tag === e.tag && f.bis === e.von)).length + hs.length;   // Platzwechsel zählt nicht als eigenes Training
    h += '<tr' + (S.team === n ? ' class="sel"' : '') + '><td class="n"><span class="sw" style="background:' + farbeVon(n) + '"></span><b>' + esc(n) + '</b>' +
      '<small>' + (anzahl ? anzahl + "× pro Woche" : "kein Training") + '</small></td>';
    for (const t of tage) {
      // direkt anschließende Abschnitte (Platzwechsel im Training) zu einem Eintrag zusammenfassen
      const x = es.filter(e => e.tag === t).sort((a, b) => min(a.von) - min(b.von)), ketten = [];
      for (const e of x) { const k = ketten[ketten.length - 1]; if (k && k[k.length - 1].bis === e.von) k.push(e); else ketten.push([e]); }
      h += '<td data-tag="' + KURZ[t % 7] + '">' + ketten.map(k => {
        const mit = [...new Set(k.flatMap(e => e.mitglieder))].filter(m => m !== n);
        const ort = k.map((e, i) => (i ? "ab " + e.von + " " : "") + felderText(e.felder)).join(", ");
        return '<div class="ut"><span class="tm">' + k[0].von + '–' + k[k.length - 1].bis + '</span>' +
          '<span class="fl">' + esc(ort) + (mit.length ? ' · mit ' + esc(mit.join(", ")) : '') + '</span></div>';
      }).join("") + hs.filter(e => e.tag === t).map(e => {
        const mit = e.mitglieder.filter(m => m !== n);
        return '<div class="ut hall"><span class="tm">' + e.von + '–' + e.bis + '</span><span class="fl">' + esc(e.ort) + (mit.length ? ' · mit ' + esc(mit.join(", ")) : '') + '</span></div>';
      }).join("") + '</td>';
    }
    h += '</tr>';
  }
  document.getElementById("tt").innerHTML = h + '</tbody>';
}

/* ---------- Halle ---------- */
function renderHalle(p, now) {
  const el = document.getElementById("hallen"), hs = p.halle || [];
  if (!hs.length) { el.innerHTML = '<p class="leer">Im ' + esc(p.saison || "") + 'plan gibt es kein Hallentraining.</p>'; return; }
  const heute = wtag(now), tNow = now.getHours() * 60 + now.getMinutes(), live = !S.plan;
  const orte = [...new Set(hs.map(h => h.ort))];
  el.innerHTML = orte.map(ort => {
    const [name, ...rest] = ort.split(",");
    return '<section class="hal"><h3>' + esc(name.trim()) + (rest.length ? '<small>' + esc(rest.join(",").trim()) + '</small>' : '') + '</h3>' +
      hs.filter(h => h.ort === ort).map(h => {
        const v = min(h.von), b = min(h.bis), istHeute = live && h.tag === heute;
        let st = '';
        if (istHeute && v <= tNow && tNow < b) st = '<span class="state live">Läuft</span>';
        else if (istHeute && v > tNow && v - tNow <= 60) st = '<span class="state soon">in ' + (v - tNow) + ' Min</span>';
        return '<div class="hu' + (istHeute ? ' heute' : '') + (S.team && !h.mitglieder.includes(S.team) ? ' other' : '') + '">' +
          '<span class="tg"><span>' + KURZ[h.tag % 7] + '</span></span><span class="tm">' + h.von + '–' + h.bis + '</span>' +
          '<span class="team"><span class="sw" style="background:' + h.farbe + '"></span><span>' + esc(h.team) + '</span></span>' + st + '</div>';
      }).join("") + '</section>';
  }).join("");
}

function fuelleAuswahl() {
  const reihenfolge = n => {
    const regeln = [/^Ballgew/i, /^G\d/, /^F\d/, /^E\d/, /^D\d/, /^C\d/, /^B\d/, /^A\d/, /^Mädchen/, /Damen/, /^\d\. Herren/, /^Alte Herren/];
    const i = regeln.findIndex(r => r.test(n)); return (i < 0 ? 99 : i) + n;
  };
  const alle = DATEN.mannschaften && DATEN.mannschaften.length ? mannschaftsliste()
    : [...new Set(DATEN.plaene.flatMap(p => p.einheiten.flatMap(e => e.mitglieder)))].sort((a, b) => reihenfolge(a).localeCompare(reihenfolge(b), "de", { numeric: true }));
  const t = document.getElementById("team");
  t.innerHTML = '<option value="">Alle</option>' + alle.map(n => '<option value="' + esc(n) + '"' + (n === S.team ? " selected" : "") + '>' + esc(n) + '</option>').join("");
  const pl = document.getElementById("plan");
  const aktiv = plan().blatt;   // Standard: der heute gültige Plan
  pl.innerHTML = DATEN.plaene.map(p => '<option value="' + esc(p.blatt) + '"' + (p.blatt === aktiv ? " selected" : "") + '>' + esc(p.saison || p.blatt) + '</option>').join("");
}

/* ---------- Bedienung ---------- */
document.getElementById("days").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.tag === "live") { S.tag = null; S.zeit = null; } else { S.tag = +b.dataset.tag; S.zeit = null; }
  render();
});
document.getElementById("zeit").addEventListener("input", ev => {
  if (S.tag === null) S.tag = anzeigeZeitpunkt(plan(), new Date()).tag;
  S.zeit = +ev.target.value; render();
});
document.getElementById("team").addEventListener("change", ev => { S.team = ev.target.value; merken(); render(); });
document.getElementById("plan").addEventListener("change", ev => {
  // der heute gültige Plan bleibt "live" (Jetzt-Linie, Planwechsel-Hinweis)
  S.plan = ev.target.value === aktuellerPlan(new Date()).blatt ? "" : ev.target.value; S.tag = null; S.zeit = null; render();
});
document.querySelector(".tablist").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return; S.ansicht = b.dataset.v; setHash(); render();
});
document.getElementById("wk").addEventListener("click", ev => {
  const b = ev.target.closest(".blk, .blk-leg"); if (!b) return;
  S.team = S.team === b.dataset.team ? "" : b.dataset.team; document.getElementById("team").value = S.team; merken(); render();
});
function stil(h) {
  document.querySelector(".board").classList.toggle("hell", h);
  const b = document.getElementById("btnStil"); b.textContent = h ? "Dunkle Ansicht" : "Helle Ansicht"; b.setAttribute("aria-pressed", "false");
}
// Standard nach Uhrzeit: 6–22 Uhr hell, 22–6 Uhr dunkel. Per Knopf oder ?stil=hell/dunkel fest eingestellt.
let stilFest = false;
const stilNachZeit = () => { const h = new Date().getHours(); return h >= 6 && h < 22; };
function stilAuto() { if (!stilFest) { const h = stilNachZeit(); if (h !== document.querySelector(".board").classList.contains("hell")) stil(h); } }
document.getElementById("btnStil").addEventListener("click", () => { stilFest = true; stil(!document.querySelector(".board").classList.contains("hell")); });
document.getElementById("btnFull").addEventListener("click", () => {
  const el = document.documentElement;
  try { if (document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen().catch(() => {}); } catch (e) {}
});
const ANSICHTEN = ["woche", "mannschaften", "halle", "platz"];
function setHash() { try { history.replaceState(null, "", "#" + S.ansicht); } catch (e) {} }
function merken() { try { localStorage.setItem("tp-team", S.team); } catch (e) {} }

// Startzustand: ?team=G4&ansicht=woche (für Links von den Mannschaftsseiten) oder #woche
(function start() {
  try { const q = new URLSearchParams(location.search); if (q.get("team")) S.team = q.get("team"); if (ANSICHTEN.includes(q.get("ansicht"))) S.ansicht = q.get("ansicht"); } catch (e) {}
  if (ANSICHTEN.includes(location.hash.slice(1))) S.ansicht = location.hash.slice(1);
  if (!S.team) { try { S.team = localStorage.getItem("tp-team") || ""; } catch (e) {} }
  let hell = stilNachZeit();   // 6–22 Uhr hell, sonst dunkel; ?stil=hell oder ?stil=dunkel legt die Ansicht fest
  try { const q = new URLSearchParams(location.search).get("stil"); if (q) { hell = q === "hell"; stilFest = true; } } catch (e) {}
  stil(hell);
  window.addEventListener("hashchange", () => { if (ANSICHTEN.includes(location.hash.slice(1))) { S.ansicht = location.hash.slice(1); render(); } });
  fuelleAuswahl();
  render();
  setInterval(stilAuto, 20000);
  setInterval(() => { if ((S.tag === null && S.zeit === null) || S.ansicht !== "platz") render(); else document.getElementById("time").textContent = hm(new Date().getHours() * 60 + new Date().getMinutes()); }, 20000);
  // auf dem Webspace: aktuelle Daten nachladen (Änderungen an der Excel-Datei erscheinen ohne Neuladen)
  async function nachladen() {
    try {
      const r = await fetch("trainingsplan.json?" + Date.now(), { cache: "no-store" });
      if (r.ok) { const d = await r.json(); if (d && d.plaene && d.erzeugt !== DATEN.erzeugt) { DATEN = d; fuelleAuswahl(); render(); } }
    } catch (e) {}
  }
  if (location.protocol.startsWith("http")) { nachladen(); setInterval(nachladen, 600000); }
})();
</script>
