name: Karte erzeugen

# Erzeugt Kartenbilder für die Homepage aus OpenStreetMap-Kacheln (karten/*.json → karten/*.jpg)
# und legt sie im Repository ab. Von dort werden sie in die WordPress-Mediathek geladen.
on:
  push:
    paths:
      - "karten/*.json"
      - "karten/karte.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: false

jobs:
  karte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow && (fc-list | grep -q DejaVuSans-Bold || sudo apt-get install -y -qq fonts-dejavu-core)
      - name: Karten erzeugen
        run: for f in karten/*.json; do python karten/karte.py "$f"; done
      - name: Karten einchecken
        run: |
          git add karten/*.jpg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Karten: Kartenbild erzeugt"
          git pull -q --rebase origin main && git push -q origin HEAD:main
