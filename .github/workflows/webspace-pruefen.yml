# Nur manuell: zeigt, was im SFTP-Startordner (/matz_dinge) liegt – zum Prüfen und Aufräumen.
name: Webspace prüfen (Ordnerübersicht)

on:
  workflow_dispatch:
    inputs:
      leerer_ordner:
        description: "Optional: LEEREN Ordner entfernen (Pfad relativ zu /matz_dinge, z. B. kalender/kalender). Nicht-leere Ordner bleiben unangetastet."
        required: false
        default: ""

jobs:
  liste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Leeren Ordner entfernen (nur wenn angegeben)
        if: ${{ inputs.leerer_ordner != '' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          ORDNER: ${{ inputs.leerer_ordner }}
        run: |
          case "$ORDNER" in *..*|/*) echo "::error::Nur Pfade innerhalb von /matz_dinge erlaubt"; exit 1;; esac
          V="set sftp:auto-confirm yes; set net:timeout 30;"
          INHALT=$(lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "$V cls -1a $ORDNER/; bye" | tr -d '\r' | grep -vE '(^|/)\.\.?/?$' | grep -v '^[[:space:]]*$' || true)
          echo "Inhalt von $ORDNER:"; echo "$INHALT"
          if [ -n "$INHALT" ]; then echo "::error::$ORDNER ist nicht leer – wird nicht entfernt."; exit 1; fi
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "$V rm -r $ORDNER; bye"
      - name: Ordner auflisten (3 Ebenen)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; set net:timeout 30; find --maxdepth=3 .; bye"
