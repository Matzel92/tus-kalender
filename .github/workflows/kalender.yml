# Ablage im Repository unter:  .github/workflows/kalender.yml
#
# Benötigte Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   SFTP_HOST      z. B. access-1234567890.webspace-host.com
#   SFTP_USER      SFTP-Benutzername aus dem IONOS-Kundenbereich
#   SFTP_PASSWORD  zugehöriges Passwort
#
# Optionale Variable (Settings -> Secrets and variables -> Actions -> Variables):
#   ZIEL_ORDNER    Unterordner im Startordner des SFTP-Benutzers, z. B. kalender
#                  (fehlt sie, wird direkt in den Startordner hochgeladen)
#   ANZEIGE_ORDNER Ordner für die Anzeigetafel im Startordner, Standard: spiele
#                  (spiele.tus-harpen.de zeigt auf /matz_dinge/spiele)

name: Spielplan auf IONOS aktualisieren

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # alle 15 Minuten, versetzt (GitHub startet teils mit Verzögerung)
  workflow_dispatch:               # manuell oder von außen (cron-job.org) startbar
  push:                            # nach jeder Änderung an den Dateien sofort neu veröffentlichen
    branches: [main]
    paths:
      - "anzeige.html"
      - "fussballde_kalender.py"
      - "spielplan_pdf.py"
      - "logo.png"
      - "favicon.png"
      - "apple-touch-icon.png"
      - "schriften/**"
      - "wappen/korrektur/**"
      - ".github/workflows/kalender.yml"

concurrency:
  group: kalender
  cancel-in-progress: false

permissions:
  contents: write                  # neue Wappen ins Repository einchecken

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0               # für das Einchecken neuer Wappen

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: |
          pip install -q requests beautifulsoup4 fonttools reportlab pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      # Vereinswappen: zentrale Ablage ist der Ordner "wappen" im Repository (neue Wappen werden
      # unten automatisch eingecheckt). Der Zwischenspeicher bleibt als Reserve bestehen.
      - name: Wappen-Zwischenspeicher holen
        uses: actions/cache@v4
        with:
          path: wappen
          key: wappen-${{ github.run_id }}
          restore-keys: wappen-

      - name: Kalender erzeugen
        run: |
          python fussballde_kalender.py --out tus-harpen.ics --json spiele.json --wappen wappen
          ls -l tus-harpen.ics
          ls wappen | wc -l

      - name: Neue Wappen im Repository ablegen
        run: |
          git add wappen
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Wappen: neue Vereinswappen von fussball.de"
          # Läuft parallel eine Änderung ein, beim nächsten Lauf erneut versuchen
          git pull -q --rebase origin main && git push -q origin HEAD:main || echo "::warning::Wappen nicht eingecheckt – nächster Lauf versucht es erneut"

      - name: PDF erzeugen (nächste 3 Monate)
        run: python spielplan_pdf.py tus-harpen.ics --out spielplan.pdf --months 3

      - name: Auf IONOS hochladen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          # Unterordner im Startordner des SFTP-Benutzers. Leer = direkt in den Startordner.
          # Einstellbar unter Settings -> Secrets and variables -> Actions -> Variables (ZIEL_ORDNER).
          ZIEL_ORDNER: ${{ vars.ZIEL_ORDNER }}
        run: |
          # Sorgt dafür, dass der Webserver die Datei als Kalender ausliefert
          printf 'AddType "text/calendar; charset=utf-8" .ics\n' > .htaccess
          # Spieldaten dürfen auch von anderswo geladen werden (z. B. lokal geöffnete Anzeige, Einbindung in die Homepage)
          printf '<IfModule mod_headers.c>\n<Files "spiele.json">\nHeader set Access-Control-Allow-Origin "*"\n</Files>\n</IfModule>\n' >> .htaccess
          # Die Anzeigetafel ist umgezogen: alte Adresse leitet auf spiele.tus-harpen.de weiter
          printf 'Redirect 301 /anzeige.html https://spiele.tus-harpen.de/\n' >> .htaccess
          ORDNER=""; [ -n "$ZIEL_ORDNER" ] && ORDNER="mkdir -p -f $ZIEL_ORDNER; cd $ZIEL_ORDNER;"
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            $ORDNER
            put tus-harpen.ics;
            put .htaccess;
            put spielplan.pdf;
            put spiele.json;
            rm -f anzeige.html;
            rm -f logo.png;
            bye"

      - name: Anzeige in eigenen Ordner hochladen (spiele.tus-harpen.de)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          # Ordner im Startordner /matz_dinge; Groß-/Kleinschreibung beachten
          ORDNER: ${{ vars.ANZEIGE_ORDNER || 'spiele' }}
        run: |
          # .htaccess für die Anzeige: immer frische Daten, Spieldaten auch von anderen Seiten abrufbar
          cat > spiele.htaccess <<'HT'
          DirectoryIndex index.html
          <IfModule mod_headers.c>
          <FilesMatch "\.(html|json)$">
          Header set Cache-Control "no-cache, must-revalidate"
          </FilesMatch>
          <Files "spiele.json">
          Header set Access-Control-Allow-Origin "*"
          </Files>
          </IfModule>
          HT
          # Wappen ändern sich praktisch nie: eine Woche im Browser zwischenspeichern
          mkdir -p wappen
          printf '<IfModule mod_headers.c>\nHeader set Cache-Control "public, max-age=604800"\n</IfModule>\n' > wappen/.htaccess
          sed -i 's/^ *//' spiele.htaccess
          # Schriften (Barlow, wie auf der Homepage) ändern sich nie: ein Jahr zwischenspeichern
          printf '<IfModule mod_headers.c>\nHeader set Cache-Control "public, max-age=31536000"\n</IfModule>\n' > schriften/.htaccess
          LOGO=""; [ -f logo.png ] && LOGO="put logo.png;"
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            mkdir -p -f $ORDNER;
            cd $ORDNER;
            put spiele.json;
            put anzeige.html -o index.html;
            put anzeige.html;
            put spiele.htaccess -o .htaccess;
            $LOGO
            put favicon.png;
            put apple-touch-icon.png;
            mirror -R --only-missing --no-perms --no-umask -x '^korrektur/' -x 'LIESMICH' wappen wappen;
            mirror -R --only-missing --no-perms --no-umask schriften schriften;
            bye"
